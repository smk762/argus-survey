[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "argus-survey"
dynamic = ["version"]
description = "Point-cloud toolkit for land surveyors: QA, ground, DTM/DSM, contours, volumes, change and accuracy with recorded datums"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "smk762" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
keywords = ["lidar", "point-cloud", "surveying", "pdal", "gdal", "dtm", "volumes", "copc"]
# PDAL, GDAL and PROJ are system tools called as subprocesses (env/geo.yml), never pip packages.
dependencies = [
    "pydantic>=2.7",
    "structlog>=24.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.27", "argus-cortex[server]>=0.2.0"]
# The CLI is part of the base install; `cli` stays as an empty alias for `argus-survey[cli]`.
cli = []
# httpx2 backs starlette's TestClient: starlette >=1.3 deprecated the httpx path
# and raises when neither client is installed, so testing the server needs it.
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff==0.15.16", "httpx2>=2.7"]

[project.scripts]
argus-survey = "argus_survey.cli:app"

[project.urls]
Repository = "https://github.com/smk762/argus-survey"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/argus_survey/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/argus_survey"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["src/argus_survey/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM108"]
