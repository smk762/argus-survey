name: CI

# Standalone rather than the shared smk762/argus-ci python-ci.yml: the suite
# shells out to PDAL/GDAL/PROJ, which no distro packages consistently any more
# (PDAL is absent from Ubuntu 24.04/26.04 and Debian). So the tool-backed tests
# run *inside the image* — the same conda-forge lockfile and datum grids users
# get — with SURVEY_TEST_REQUIRE_TOOLS=1 turning every tool skip into a failure.
# The pure-Python suite also runs on the oldest and newest supported Pythons.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: ruff check
        run: uvx ruff@0.15.16 check src/ tests/
      - name: ruff format --check
        run: uvx ruff@0.15.16 format --check src/ tests/

  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hatch-vcs derives the dev version from git history
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras --python ${{ matrix.python-version }}
      - run: uv run --no-sync pytest --tb=short -q

  image-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - name: Build the test image (runs `doctor --strict` inside)
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: EXTRAS=server,cli,dev
          tags: argus-survey:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Same container setup as compose's `test` service, but run directly so the image
      # just built from the GHA layer cache is used (compose's pull_policy: build would rebuild).
      - name: Full suite against real PDAL/GDAL/PROJ
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/src" -w /src \
            -e HOME=/tmp -e PYTHONPATH=/src/src -e PYTHONDONTWRITEBYTECODE=1 -e SURVEY_TEST_REQUIRE_TOOLS=1 \
            argus-survey:test python -m pytest -q -p no:cacheprovider

  build:
    runs-on: ubuntu-latest
    needs: [lint, unit, image-test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14

  suite-rules:
    # argus-ci suite rules: lint rules that each eliminate a finding class. New violations fail;
    # existing ones are in .suite-rules-baseline.json, which may only shrink.
    uses: smk762/argus-ci/.github/workflows/suite-rules.yml@v1

  docs-check:
    # argus-ci docs check: docs/cli.md matches the CLI, and README.md + docs/**/*.md (what PyPI and
    # argus-sightline publish) carry no private IPs, home or server paths, or non-noreply emails.
    uses: smk762/argus-ci/.github/workflows/docs-check.yml@v1
    with:
      cli-module: argus_survey.cli
      cli-name: argus-survey
    secrets:
      denylist: ${{ secrets.DOCS_DENYLIST }}

  branches:
    # main is never ahead of dev. A PR into main is only the release PR from dev, and every commit
    # pushed to main carries a tree dev already has: a fast-forward to a dev commit, or the release
    # PR's merge commit (identical to the dev commit it merged).
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: main carries nothing dev lacks
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -eu
          if [ "$EVENT" = pull_request ]; then
            if [ "$HEAD_REF" != dev ]; then
              echo "::error::PRs into main come only from dev (the release PR); this one is from ${HEAD_REF}"
              exit 1
            fi
            exit 0
          fi
          git fetch -q origin dev
          tree=$(git rev-parse 'HEAD^{tree}')
          if ! git log --format=%T origin/dev | grep -qx "$tree"; then
            echo "::error::main ($(git rev-parse --short HEAD)) has content dev lacks: git diff origin/dev $(git rev-parse --short HEAD)"
            exit 1
          fi
          echo "main's tree is on dev."
