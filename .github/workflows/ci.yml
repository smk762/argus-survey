name: CI

# Standalone rather than the shared smk762/argus-ci python-ci.yml: the suite
# shells out to PDAL/GDAL/PROJ, which no distro packages consistently any more
# (PDAL is absent from Ubuntu 24.04/26.04 and Debian). So the tool-backed tests
# run *inside the image* — the same conda-forge lockfile and datum grids users
# get — with SURVEY_TEST_REQUIRE_TOOLS=1 turning every tool skip into a failure.
# The pure-Python suite also runs on the oldest and newest supported Pythons.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: ruff check
        run: uvx ruff@0.15.16 check src/ tests/
      - name: ruff format --check
        run: uvx ruff@0.15.16 format --check src/ tests/

  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hatch-vcs derives the dev version from git history
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras --python ${{ matrix.python-version }}
      - run: uv run --no-sync pytest --tb=short -q

  image-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - name: Build the test image (runs `doctor --strict` inside)
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: EXTRAS=server,cli,dev
          tags: argus-survey:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Full suite against real PDAL/GDAL/PROJ
        run: |
          export UID GID="$(id -g)"
          docker compose --profile test run --rm test

  build:
    runs-on: ubuntu-latest
    needs: [lint, unit, image-test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14
